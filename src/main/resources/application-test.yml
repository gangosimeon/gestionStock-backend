# =============================================================================
# Profil test — tests d'intégration (activé par @ActiveProfiles("test"))
#
# Base de données :
#  - Docker disponible : conteneur PostgreSQL Testcontainers (ces valeurs sont ignorées) ;
#  - sinon : base externe dédiée, par défaut jdbc:postgresql://localhost:5432/geststock_test.
#    ATTENTION : cette base doit être réservée aux tests.
#  - mot de passe : variable GESTSTOCK_TEST_DB_PASSWORD, ou fichier local non versionné
#    config/application-test.yml (spring.datasource.password). Jamais dans ce fichier.
# =============================================================================

spring:
  datasource:
    url: ${GESTSTOCK_TEST_DB_URL:jdbc:postgresql://localhost:5432/geststock_test}
    username: ${GESTSTOCK_TEST_DB_USERNAME:postgres}
    password: ${GESTSTOCK_TEST_DB_PASSWORD:}

geststock:
  cors:
    allowed-origins: http://localhost:4200
  security:
    jwt:
      # Clé publique de test, sans valeur hors des tests automatisés.
      secret: test-only-signing-key-not-for-production-0123456789
    login:
      max-failed-attempts: 3
  # Base de test = entreprise « test », visée sans contexte (identités simulées, JdbcTemplate des tests).
  tenancy:
    default-company: test
    database-prefix: gst_test_company_
  platform:
    legacy-company:
      code: test
      name: Entreprise de test
    # Clé publique de test, sans valeur hors des tests automatisés.
    credentials-key: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nLTAwMDA=
  # Flux d'intégration boutique en ligne : publication active en test (désactivée par défaut).
  integration:
    publish:
      enabled: true
    # Signature des pageToken d'instantané : clés publiques de test, sans valeur hors des tests automatisés.
    # test-0 : ancienne clé, encore listée (vérification seulement) ; test-1 : clé courante.
    page-token:
      current-kid: test-1
      keys:
        test-0: Z2VzdHN0b2NrLXRlc3QtcGFnZS10b2tlbi1rZXktMC1wcmV2aW91cy1ub3QtYS1zZWNyZXQ=
        test-1: Z2VzdHN0b2NrLXRlc3QtcGFnZS10b2tlbi1rZXktMS1ub3QtYS1zZWNyZXQ=
    # Liaisons avec les boutiques en ligne : activées en test (désactivées par défaut). Clés de signature des jetons
    # de liaison : clés publiques de test, sans valeur hors des tests automatisés, distinctes du secret JWT.
    # test-0 : ancienne clé, encore listée (vérification seulement) ; test-1 : clé courante.
    links:
      enabled: true
      token:
        current-kid: test-1
        keys:
          test-0: Z2VzdHN0b2NrLXRlc3QtbGluay10b2tlbi1rZXktMC1wcmV2aW91cy1ub3QtYS1zZWNyZXQ=
          test-1: Z2VzdHN0b2NrLXRlc3QtbGluay10b2tlbi1rZXktMS1jdXJyZW50LW5vdC1hLXNlY3JldA==
    # Limites de débit relevées : les tests appellent les routes du client depuis la même adresse (127.0.0.1).
    # IntegrationRateLimitIT rétablit les valeurs de départ (10, 10, 30, 30 par minute).
    rate-limit:
      oauth-token-per-client: 100000
      oauth-token-per-ip: 100000
      oauth-par-per-client: 100000
      oauth-par-per-ip: 100000
