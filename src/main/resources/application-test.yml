# =============================================================================
# Profil test — tests d'intégration (activé par @ActiveProfiles("test"))
#
# Base de données :
#  - Docker disponible : conteneur PostgreSQL Testcontainers (ces valeurs sont ignorées) ;
#  - sinon : base externe dédiée, par défaut jdbc:postgresql://localhost:5432/geststock_test.
#    ATTENTION : cette base doit être réservée aux tests.
#  - mot de passe : variable GESTSTOCK_TEST_DB_PASSWORD, ou fichier local non versionné
#    config/application-test.yml (spring.datasource.password). Jamais dans ce fichier.
# =============================================================================

spring:
  datasource:
    url: ${GESTSTOCK_TEST_DB_URL:jdbc:postgresql://localhost:5432/geststock_test}
    username: ${GESTSTOCK_TEST_DB_USERNAME:postgres}
    password: ${GESTSTOCK_TEST_DB_PASSWORD:}

geststock:
  cors:
    allowed-origins: http://localhost:4200
  security:
    jwt:
      # Clé publique de test, sans valeur hors des tests automatisés.
      secret: test-only-signing-key-not-for-production-0123456789
    login:
      max-failed-attempts: 3
  # Base de test = entreprise « test », visée sans contexte (identités simulées, JdbcTemplate des tests).
  tenancy:
    default-company: test
    database-prefix: gst_test_company_
  platform:
    legacy-company:
      code: test
      name: Entreprise de test
    # Clé publique de test, sans valeur hors des tests automatisés.
    credentials-key: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nLTAwMDA=
  # Flux d'intégration boutique en ligne : publication active en test (désactivée par défaut).
  integration:
    publish:
      enabled: true
