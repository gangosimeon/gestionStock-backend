# =============================================================================
# GestStock backend — configuration commune à tous les profils
# Les valeurs sensibles viennent TOUJOURS de variables d'environnement.
# Profils : dev (par défaut), test, prod. Voir README.md.
# =============================================================================

spring:
  application:
    name: geststock-backend

  profiles:
    # Profil utilisé quand aucun n'est fourni (SPRING_PROFILES_ACTIVE).
    default: dev

  autoconfigure:
    # Pas d'utilisateur en mémoire généré par Spring Boot : l'authentification
    # sera fournie par le module security (JWT).
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  # --- PostgreSQL -------------------------------------------------------------
  datasource:
    url: ${GESTSTOCK_DB_URL:jdbc:postgresql://localhost:5432/geststock}
    username: ${GESTSTOCK_DB_USERNAME:geststock}
    password: ${GESTSTOCK_DB_PASSWORD:}
    hikari:
      pool-name: geststock-pool
      maximum-pool-size: ${GESTSTOCK_DB_POOL_SIZE:10}
      minimum-idle: ${GESTSTOCK_DB_POOL_MIN_IDLE:2}
      # Millisecondes (propriétés Hikari brutes : pas de suffixe d'unité).
      # Attente maximale d'une connexion libre avant erreur (pool saturé ou base injoignable).
      connection-timeout: ${GESTSTOCK_DB_CONNECTION_TIMEOUT_MS:10000}
      # Connexion inactive rendue après 10 min ; renouvelée au plus tard après 30 min
      # (sous les délais de coupure des pare-feu et proxys courants).
      idle-timeout: 600000
      max-lifetime: 1800000
      # Connexions inactives vérifiées toutes les 5 min (détecte une base redémarrée).
      keepalive-time: 300000
      # Connexion non rendue au pool au-delà de 60 s : trace dans les logs (fuite probable).
      leak-detection-threshold: ${GESTSTOCK_DB_LEAK_DETECTION_MS:60000}
      data-source-properties:
        # Nom visible dans pg_stat_activity (diagnostic côté base).
        ApplicationName: geststock-backend
        tcpKeepAlive: true
        # Secondes : une requête bloquée (réseau, verrou) n'immobilise pas un thread indéfiniment.
        socketTimeout: ${GESTSTOCK_DB_SOCKET_TIMEOUT_S:120}

  # --- JPA / Hibernate ----------------------------------------------------------
  jpa:
    # Aucune requête paresseuse pendant le rendu HTTP : les DTO sont construits
    # dans les services transactionnels.
    open-in-view: false
    hibernate:
      # Flyway est l'unique source du schéma ; Hibernate ne fait que vérifier.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
        # Collections paresseuses chargées par lots de 50 (évite le N+1 sur les listes).
        default_batch_fetch_size: 50

  # --- Flyway -------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false

  # --- Transactions -------------------------------------------------------------
  transaction:
    # Plafond par transaction (exports et rapports compris) : au-delà, annulation propre.
    default-timeout: ${GESTSTOCK_TX_TIMEOUT:60s}

  # --- Arrêt gracieux ---------------------------------------------------------------
  lifecycle:
    # Requêtes en cours terminées avant l'arrêt (déploiement, redémarrage du conteneur).
    timeout-per-shutdown-phase: 30s

  # --- Web ----------------------------------------------------------------------
  web:
    # Messages de validation (Bean Validation) en français, quel que soit le client.
    locale: fr_FR
    locale-resolver: fixed

server:
  port: ${GESTSTOCK_SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    # Client qui n'envoie rien après ouverture de la connexion : coupé après 20 s.
    connection-timeout: 20s
    threads:
      max: ${GESTSTOCK_HTTP_THREADS_MAX:200}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

# --- Actuator : seule la santé est exposée ------------------------------------
# /actuator/health           : état global (base de données comprise), sans détail
# /actuator/health/liveness  : le processus répond (redémarrer le conteneur sinon)
# /actuator/health/readiness : prêt à recevoir du trafic (base joignable)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState, db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# --- OpenAPI / Swagger UI -----------------------------------------------------
springdoc:
  api-docs:
    path: /v3/api-docs
    # OpenAPI 3.0 : format le mieux pris en charge par les générateurs de clients Angular.
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html
    # Jeton conservé entre deux rechargements ; opérations et tags triés ; durée des appels affichée.
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha
    doc-expansion: none
    display-request-duration: true
    display-operation-id: true
  paths-to-match: /api/**
  # Types explicites pour les générateurs de clients (au lieu de */*).
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  packages-to-scan: com.geststock

# --- Paramètres applicatifs ---------------------------------------------------
geststock:
  api:
    version: '@project.version@'
  cors:
    allowed-origins: ${GESTSTOCK_CORS_ALLOWED_ORIGINS:}
  security:
    jwt:
      # Clé HMAC-SHA256 (32 octets minimum). Obligatoire hors dev/test.
      secret: ${GESTSTOCK_JWT_SECRET:}
      issuer: geststock
      access-token-ttl: ${GESTSTOCK_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${GESTSTOCK_REFRESH_TOKEN_TTL:7d}
      allow-ephemeral-secret: false
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    bootstrap-admin:
      # Créé au démarrage s'il n'existe aucun administrateur actif. Aucune valeur par défaut.
      username: ${GESTSTOCK_ADMIN_USERNAME:}
      password: ${GESTSTOCK_ADMIN_PASSWORD:}
  sales:
    # Remise maximale par ligne de vente, en %. Règle définitive à valider (décision I.7).
    max-discount-percent: ${GESTSTOCK_SALES_MAX_DISCOUNT_PERCENT:20}
  dashboard:
    # Fuseau de l'entreprise : « aujourd'hui » et découpage par jour des indicateurs.
    time-zone: ${GESTSTOCK_DASHBOARD_TIME_ZONE:Africa/Abidjan}

logging:
  pattern:
    # traceId : identifiant de corrélation (en-tête X-Trace-Id, corps des erreurs).
    level: "%5p [%X{traceId:-}]"
