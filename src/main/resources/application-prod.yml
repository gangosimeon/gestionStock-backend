# =============================================================================
# Profil prod — aucune valeur par défaut pour les paramètres critiques :
# l'application refuse de démarrer si une variable obligatoire manque.
# Variables requises : GESTSTOCK_DB_URL, GESTSTOCK_DB_USERNAME, GESTSTOCK_DB_PASSWORD, GESTSTOCK_JWT_SECRET,
#                      GESTSTOCK_CORS_ALLOWED_ORIGINS
# Contrôles au démarrage : config/ProductionSafetyCheck (CORS https sans « * », mot de passe
# administrateur initial robuste). Liste complète : docs/production.md.
# =============================================================================

spring:
  datasource:
    url: ${GESTSTOCK_DB_URL}
    username: ${GESTSTOCK_DB_USERNAME}
    password: ${GESTSTOCK_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${GESTSTOCK_DB_POOL_SIZE:20}

server:
  # Derrière un reverse proxy (HTTPS terminé en amont).
  forward-headers-strategy: framework

# Documentation API non exposée en production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

geststock:
  cors:
    allowed-origins: ${GESTSTOCK_CORS_ALLOWED_ORIGINS}
  security:
    jwt:
      # Obligatoire : le démarrage échoue sans GESTSTOCK_JWT_SECRET (>= 32 octets).
      secret: ${GESTSTOCK_JWT_SECRET}

logging:
  level:
    root: INFO
    com.geststock: INFO
    # Requêtes SQL jamais journalisées en production (données personnelles).
    org.hibernate.SQL: WARN
  # Journaux JSON (format ECS) sur la sortie standard : collectés par Docker / la plateforme,
  # traceId (MDC) inclus pour relier une erreur à la requête. Autres formats : logstash, gelf.
  structured:
    format:
      console: ${GESTSTOCK_LOG_FORMAT:ecs}
