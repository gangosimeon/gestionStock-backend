# =============================================================================
# Profil dev — poste de développement (profil par défaut)
# Base attendue : jdbc:postgresql://localhost:5432/geststock (voir README.md)
# =============================================================================

spring:
  flyway:
    # Schéma + données de démonstration (dev uniquement).
    locations: classpath:db/migration,classpath:db/seed/dev

management:
  endpoint:
    health:
      show-details: always

geststock:
  cors:
    allowed-origins: ${GESTSTOCK_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      # Sans GESTSTOCK_JWT_SECRET : clé aléatoire à chaque démarrage (sessions perdues).
      allow-ephemeral-secret: true
  # Base de dev rattachée comme entreprise « principale » et visée sans contexte (outils, scripts).
  tenancy:
    default-company: ${GESTSTOCK_DEFAULT_COMPANY:principale}
    database-prefix: ${GESTSTOCK_TENANT_DATABASE_PREFIX:geststock_dev_company_}
  platform:
    legacy-company:
      code: ${GESTSTOCK_LEGACY_COMPANY_CODE:principale}
  # Flux d'intégration boutique en ligne : publication active en dev (désactivée par défaut).
  integration:
    publish:
      enabled: true
    # Signature des pageToken d'instantané : clé de développement, sans valeur hors du poste local.
    page-token:
      current-kid: dev-1
      keys:
        dev-1: Z2VzdHN0b2NrLWRldi1wYWdlLXRva2VuLWtleS0xLW5vdC1hLXNlY3JldA==
    # Liaisons avec les boutiques en ligne : désactivées par défaut (GESTSTOCK_INTEGRATION_LINKS_ENABLED=true pour les
    # essayer). Clé de signature des jetons de liaison : clé de développement, sans valeur hors du poste local.
    links:
      enabled: ${GESTSTOCK_INTEGRATION_LINKS_ENABLED:false}
      token:
        current-kid: dev-1
        keys:
          dev-1: Z2VzdHN0b2NrLWRldi1saW5rLXRva2VuLWtleS0xLWxvY2FsLW9ubHktbm90LWEtc2VjcmV0

logging:
  level:
    com.geststock: DEBUG
