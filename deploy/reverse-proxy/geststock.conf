# =============================================================================
# Reverse proxy public (Nginx sur le serveur) : HTTPS terminé ici, puis tout est transmis au
# conteneur front (qui sert l'application et relaie /api au backend).
# Certificat Let's Encrypt : certbot --nginx -d geststock.example.com
# Remplacer geststock.example.com par le domaine réel.
# =============================================================================

server {
  listen 80;
  listen [::]:80;
  server_name geststock.example.com;
  # Validation Let's Encrypt, puis redirection permanente vers HTTPS.
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name geststock.example.com;
  server_tokens off;

  ssl_certificate     /etc/letsencrypt/live/geststock.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/geststock.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;

  # HTTPS imposé au navigateur pendant 1 an.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Santé interne du backend : jamais exposée publiquement.
  location /actuator/ { return 404; }

  location / {
    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 90s;
    client_max_body_size 10m;
  }

  # Limite de débit sur la connexion (complète le verrouillage du compte après 5 échecs).
  location = /api/auth/login {
    limit_req zone=geststock_login burst=5 nodelay;
    proxy_pass http://127.0.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

# À placer dans le bloc http { } de nginx.conf :
# limit_req_zone $binary_remote_addr zone=geststock_login:10m rate=10r/m;
