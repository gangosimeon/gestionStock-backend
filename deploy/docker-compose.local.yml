# =============================================================================
# Pile complète en local, configurée comme la production (profil prod) :
#   PostgreSQL + backend + front (Nginx), accessible sur http://localhost:8088
#
#   cp deploy/.env.example deploy/.env      # puis renseigner les secrets (jamais versionné)
#   docker compose -f deploy/docker-compose.local.yml --env-file deploy/.env up -d --build
#
# Le front est construit depuis le dépôt voisin ../../gestion-stock.
# Pour le développement quotidien, seul PostgreSQL suffit : docker-compose.yml (racine).
# =============================================================================
name: geststock-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: geststock
      POSTGRES_USER: geststock
      POSTGRES_PASSWORD: ${GESTSTOCK_DB_PASSWORD:?Definir GESTSTOCK_DB_PASSWORD}
      TZ: UTC
    # Aucun port publié : la base n'est joignable que par le backend.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geststock -d geststock"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build: ..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      GESTSTOCK_DB_URL: jdbc:postgresql://postgres:5432/geststock
      GESTSTOCK_DB_USERNAME: geststock
      GESTSTOCK_DB_PASSWORD: ${GESTSTOCK_DB_PASSWORD}
      GESTSTOCK_JWT_SECRET: ${GESTSTOCK_JWT_SECRET:?Definir GESTSTOCK_JWT_SECRET}
      GESTSTOCK_CORS_ALLOWED_ORIGINS: http://localhost:8088
      # Recette locale en http : autorisé ici seulement (refusé par défaut en prod).
      GESTSTOCK_PRODUCTION_ALLOW_HTTP_ORIGINS: "true"
      GESTSTOCK_ADMIN_USERNAME: ${GESTSTOCK_ADMIN_USERNAME:-admin}
      GESTSTOCK_ADMIN_PASSWORD: ${GESTSTOCK_ADMIN_PASSWORD:?Definir GESTSTOCK_ADMIN_PASSWORD}
      GESTSTOCK_LOG_FORMAT: ${GESTSTOCK_LOG_FORMAT:-ecs}
    restart: unless-stopped

  frontend:
    build: ../../gestion-stock
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  pgdata:
